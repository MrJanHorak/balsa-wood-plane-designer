<title>Sky Scout Trainer — cutting templates</title><desc>Units: mm. Red: cut. Blue: score/fold/glue guides, not through-cuts. Layout is not stock nesting; separate parts by sheet thickness and grain. Nominal geometry; apply tool kerf in CAM and test slot fit. WING BLANK: Chord arc-length allowance applied. This is an approximate forming blank; sweep, taper and center folds need a prototype fit check. DIHEDRAL: through-slots include assembled-wing relief; test the insertion sequence and center fold on scrap.</desc>
